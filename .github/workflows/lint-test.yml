name: Lint and Test

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install
        run: yarn install
        working-directory: ./task

      - name: Lint
        run: yarn lint
        working-directory: ./task

      - name: Test
        run: yarn test
        working-directory: ./task
